name: Initialize retained public screener artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feed: [stocks, games-kalshi-0, games-kalshi-1, games-polymarket_us-0, games-polymarket_us-1, perps-0, perps-1, perps-2, perps-3]
    env:
      GH_TOKEN: ${{ github.token }}
      FEED: ${{ matrix.feed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: |
          mkdir -p seed
          gh release download screener-bootstrap-seed --pattern "$FEED.json.gz" --dir seed
          python -m market_research.public_snapshots --feed "$FEED" --seed "seed/$FEED.json.gz" --output published
      - uses: actions/upload-artifact@v7
        with:
          name: quantura-public-${{ matrix.feed }}
          path: published/snapshot.json.gz
          retention-days: 7
          if-no-files-found: error
