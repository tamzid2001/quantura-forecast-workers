name: Games P01 — Forward Limit Paper Trader
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Forward observation duration (1–345 minutes)
        default: 345
        type: number
permissions:
  contents: read
  actions: read
concurrency:
  group: games-p01-limit-paper-v1
  cancel-in-progress: false
jobs:
  paper:
    if: github.event_name == 'workflow_dispatch' || vars.GAMES_P01_LIMIT_PAPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONUNBUFFERED: '1'
      GITHUB_TOKEN: ${{ github.token }}
      DURATION_MINUTES: ${{ inputs.duration_minutes || 345 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Track current books with a fixed ask-minus-one-cent limit (paper only)
        run: |
          if ! [[ "$DURATION_MINUTES" =~ ^[0-9]+$ ]] || (( DURATION_MINUTES < 1 || DURATION_MINUTES > 345 )); then
            exit 1
          fi
          python -m market_research.game_p01_limit_worker --mode paper --restore-artifact --minutes "$DURATION_MINUTES" --output "$RUNNER_TEMP/games-limit-paper"
      - name: Preserve the cumulative paper ledger even after an interrupted run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quantura-games-p01-limit-paper-v1
          path: ${{ runner.temp }}/games-limit-paper/limit-state.json.gz
          if-no-files-found: error
          retention-days: 90
      - name: Publish statistics and readable order ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quantura-games-p01-limit-paper-stats
          path: |
            ${{ runner.temp }}/games-limit-paper/stats.json
            ${{ runner.temp }}/games-limit-paper/limit-ledger.csv
          if-no-files-found: warn
          retention-days: 90
