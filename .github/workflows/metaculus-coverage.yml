name: Quantura MiniBench round coverage
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      METACULUS_BOT_ID: ${{ vars.METACULUS_BOT_ID }}
      METACULUS_CHECKPOINT_NAMESPACE: bot-${{ vars.METACULUS_BOT_ID }}
      METACULUS_CHECKPOINT_WORKFLOW: metaculus-bot.yml
      METACULUS_CHECKPOINT_BRANCH: main
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metaculus_bot/requirements.lock
      - run: python -m pip install --require-hashes -r metaculus_bot/requirements.lock
      - name: Read encrypted pending-generation diagnostics from the production worker
        run: python -m metaculus_bot.checkpoint --restore artifacts/metaculus-checkpoint.enc
      - name: Audit forecasts and private reasoning without inference or writes
        run: python -m metaculus_bot.minibench --checkpoint artifacts/metaculus-checkpoint.enc
      - uses: actions/upload-artifact@v7
        with:
          name: metaculus-minibench-coverage
          path: artifacts/metaculus-minibench.json
          retention-days: 30
          if-no-files-found: error
