name: Pinned foundation-model CPU SDK diagnostic
on:
  workflow_dispatch:
    inputs:
      model:
        description: Real CPU fixture adapter to diagnose; no market publication
        type: choice
        options: [toto, granite, chronos, timesfm, timestral, t0]
        default: toto
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CUDA_VISIBLE_DEVICES: ''
      TOKENIZERS_PARALLELISM: 'false'
      MODEL_ID: ${{ inputs.model || 'toto' }}
      TIMESFM_HF_ACCESS_APPROVED: ${{ vars.TIMESFM_HF_ACCESS_APPROVED || 'false' }}
      ALLOW_NONCOMMERCIAL_TIMESFM: 'true'
      TIMESFM_COMMERCIAL_LICENSED: 'false'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install the existing pinned production SDK environment
        run: python -m pip install --no-cache-dir --require-hashes -r market_research/requirements.lock
      - name: Evaluate the native API and real adapter on synthetic CPU fixtures
        env:
          HF_HOME: ${{ runner.temp }}/toto-diagnostic
        run: python -m scripts.toto_runtime_smoke --model "$MODEL_ID"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toto-runtime-diagnostic
          path: artifacts/toto-runtime-smoke.json
          if-no-files-found: error
          retention-days: 1
