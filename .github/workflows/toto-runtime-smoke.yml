name: Toto pinned CPU SDK diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: ${{ runner.temp }}/toto-diagnostic
      CUDA_VISIBLE_DEVICES: ''
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install the existing pinned production SDK environment
        run: python -m pip install --no-cache-dir --require-hashes -r market_research/requirements.lock
      - name: Evaluate the native API and real adapter on synthetic CPU fixtures
        run: python -m scripts.toto_runtime_smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toto-runtime-diagnostic
          path: artifacts/toto-runtime-smoke.json
          if-no-files-found: error
          retention-days: 7
