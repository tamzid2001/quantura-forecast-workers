name: Games P01 — Hourly Within and Outside 10c Paper Portfolios
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      resume_forward_after_gap:
        type: boolean
        default: false
        description: 'Record a missing observation interval and start a separate future-only cohort after fresh publications are verified'
permissions:
  contents: read
  actions: read
concurrency:
  group: games-p01-paper-v1
  cancel-in-progress: false
jobs:
  paper:
    if: github.event_name == 'workflow_dispatch' || vars.GAMES_P01_PAPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      GITHUB_TOKEN: ${{ github.token }}
      GAMES_P01_PAPER_ACTIVATED_AT: ${{ vars.GAMES_P01_PAPER_ACTIVATED_AT }}
      RESUME_FORWARD_AFTER_GAP: ${{ inputs.resume_forward_after_gap || false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Replay recorded asks and reconcile official settlements (paper only)
        run: |
          extra=()
          if [ "$RESUME_FORWARD_AFTER_GAP" = "true" ]; then extra+=(--resume-forward-after-gap); fi
          python -m market_research.game_p01_paper --output "$RUNNER_TEMP/games-paper" "${extra[@]}"
      - name: Show the 2c first-choice and within/outside 10c paper comparison
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/games-paper/comparison-summary.md" ]; then
            cat "$RUNNER_TEMP/games-paper/comparison-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve cumulative checkpoint even when public data is temporarily unavailable
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quantura-games-p01-paper-v1
          path: ${{ runner.temp }}/games-paper/paper-state.json.gz
          if-no-files-found: error
          retention-days: 90
      - name: Publish readable paper statistics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quantura-games-p01-paper-stats
          path: |
            ${{ runner.temp }}/games-paper/stats.json
            ${{ runner.temp }}/games-paper/paper-ledger.csv
            ${{ runner.temp }}/games-paper/comparison-stats.json
            ${{ runner.temp }}/games-paper/comparison-ledger.csv
            ${{ runner.temp }}/games-paper/comparison-summary.md
          if-no-files-found: warn
          retention-days: 90
