name: Games P01 — Automatic Paper Portfolio
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: games-p01-paper-v1
  cancel-in-progress: false
jobs:
  paper:
    if: github.event_name == 'workflow_dispatch' || vars.GAMES_P01_PAPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      GITHUB_TOKEN: ${{ github.token }}
      GAMES_P01_PAPER_ACTIVATED_AT: ${{ vars.GAMES_P01_PAPER_ACTIVATED_AT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Replay recorded asks and reconcile official settlements (paper only)
        run: python -m market_research.game_p01_paper --output "$RUNNER_TEMP/games-paper"
      - name: Preserve cumulative checkpoint even when public data is temporarily unavailable
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quantura-games-p01-paper-v1
          path: ${{ runner.temp }}/games-paper/paper-state.json.gz
          if-no-files-found: error
          retention-days: 90
      - name: Publish readable paper statistics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quantura-games-p01-paper-stats
          path: |
            ${{ runner.temp }}/games-paper/stats.json
            ${{ runner.temp }}/games-paper/paper-ledger.csv
          if-no-files-found: warn
          retention-days: 90
